name: publish-desktop
run-name: release desktop

# The release version is the top "## MAJOR.MINOR.PATCH" section of packages/desktop/CHANGELOG.md, and
# that section becomes the release notes. Add it on dev before dispatching.
on:
  workflow_dispatch:
    inputs:
      # Escape hatch for shipping Windows before the Key Vault certificate exists. Off, the Windows legs
      # skip signing and the signature check and the release notes say the installers are unsigned.
      sign_windows:
        description: "Sign the Windows installers (turn off only to ship an unsigned preview)"
        type: boolean
        default: true

# One desktop release at a time: version.ts checks the changelog version against what is already
# published and deletes other desktop drafts as leftovers, both of which assume no other run is in flight.
concurrency:
  group: publish-desktop
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    if: github.repository == 'jolliai/jollicode'
    steps:
      # Releases are cut from dev only, the same rule as the CLI: the source tag should always point at
      # a commit dev contains, and the release should never ship code dev does not have.
      - name: Require dev branch
        if: github.ref != 'refs/heads/dev'
        run: |
          echo "::error::Desktop releases must be dispatched from dev (got $GITHUB_REF)"
          exit 1

      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: ./.github/actions/setup-bun

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          jollicode-app-id: ${{ vars.JOLLICODE_APP_ID }}
          jollicode-app-secret: ${{ secrets.JOLLICODE_APP_SECRET }}

      - id: changelog
        run: bun ./packages/script/src/changelog.ts packages/desktop/CHANGELOG.md "$RUNNER_TEMP/desktop-release-notes.md"

      - id: version
        run: bun ./packages/desktop/scripts/version.ts
        env:
          GH_TOKEN: ${{ steps.committer.outputs.token }}
          GH_REPO: jolliai/jollicode-releases
          DESKTOP_VERSION: ${{ steps.changelog.outputs.version }}
          RELEASE_NOTES_FILE: ${{ steps.changelog.outputs.notes }}
          DESKTOP_SIGN_WINDOWS: ${{ inputs.sign_windows }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      repo: ${{ steps.version.outputs.repo }}
      cli_version: ${{ steps.version.outputs.cli_version }}

  build-electron:
    needs:
      - version
    if: github.repository == 'jolliai/jollicode'
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_KEY_VAULT_URL: ${{ inputs.sign_windows && secrets.AZURE_KEY_VAULT_URL || '' }}
      AZURE_KEY_VAULT_CERTIFICATE: ${{ inputs.sign_windows && secrets.AZURE_KEY_VAULT_CERTIFICATE || '' }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-26-intel
            target: x86_64-apple-darwin
            platform_flag: --mac --x64
            bun_install_flags: --os=darwin --cpu=x64
          - host: macos-26
            target: aarch64-apple-darwin
            platform_flag: --mac --arm64
            bun_install_flags: --os=darwin --cpu=arm64
          # ARM64 MSVC cross-compilation needs the windows-2025 image explicitly
          - host: "windows-2025"
            target: aarch64-pc-windows-msvc
            platform_flag: --win --arm64
          - host: "windows-latest"
            target: x86_64-pc-windows-msvc
            platform_flag: --win
          - host: "ubuntu-latest"
            target: x86_64-unknown-linux-gnu
            platform_flag: --linux
          - host: "ubuntu-24.04-arm"
            target: aarch64-unknown-linux-gnu
            platform_flag: --linux --arm64
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: apple-actions/import-codesign-certs@8f3fb608891dd2244cdab3d69cd68c0d37a7fe93 # v2.0.0
        if: runner.os == 'macOS'
        with:
          keychain: build
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Setup Apple API Key
        if: runner.os == 'macOS'
        run: echo "${{ secrets.APPLE_API_KEY_PATH }}" > "$RUNNER_TEMP/apple-api-key.p8"

      - uses: ./.github/actions/setup-bun
        with:
          install-flags: ${{ matrix.settings.bun_install_flags }}

      # The desktop installer never ships unsigned: the signature check after packaging would fail the
      # leg anyway, so missing secrets fail here by name instead of as an opaque Azure login error.
      - name: Warn about unsigned Windows installers
        if: runner.os == 'Windows' && !inputs.sign_windows
        run: echo "::warning::sign_windows is off; publishing UNSIGNED Windows installers"

      - name: Check Windows signing secrets
        if: runner.os == 'Windows' && inputs.sign_windows
        shell: bash
        run: |
          names=(AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_KEY_VAULT_URL AZURE_KEY_VAULT_CERTIFICATE)
          missing=()
          for name in "${names[@]}"; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Azure Key Vault signing is not configured; missing: ${missing[*]}"
            exit 1
          fi

      - name: Azure login
        if: runner.os == 'Windows' && inputs.sign_windows
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Cache apt packages
        if: contains(matrix.settings.host, 'ubuntu')
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/apt-cache
          key: ${{ runner.os }}-${{ matrix.settings.target }}-apt-electron-${{ hashFiles('.github/workflows/publish-desktop.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.settings.target }}-apt-electron-

      - name: Install dependencies (ubuntu only)
        if: contains(matrix.settings.host, 'ubuntu')
        run: |
          mkdir -p ~/apt-cache && chmod -R a+rw ~/apt-cache
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o dir::cache::archives="$HOME/apt-cache" rpm
          sudo chmod -R a+rw ~/apt-cache

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          jollicode-app-id: ${{ vars.JOLLICODE_APP_ID }}
          jollicode-app-secret: ${{ secrets.JOLLICODE_APP_SECRET }}

      - name: Prepare
        run: bun ./scripts/prepare.ts
        working-directory: packages/desktop
        env:
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
          OPENCODE_CHANNEL: prod
          RUST_TARGET: ${{ matrix.settings.target }}

      - name: Build
        run: bun run build
        working-directory: packages/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
          JOLLICODE_CLI_VERSION: ${{ needs.version.outputs.cli_version }}
          OPENCODE_CHANNEL: prod
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.WEB_SENTRY_PROJECT }}
          SENTRY_RELEASE: desktop@${{ needs.version.outputs.version }}
          VITE_SENTRY_DSN: ${{ vars.WEB_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: production
          VITE_SENTRY_RELEASE: desktop@${{ needs.version.outputs.version }}

      - name: Package
        run: npx electron-builder ${{ matrix.settings.platform_flag }} --publish never --config electron-builder.config.ts
        working-directory: packages/desktop
        timeout-minutes: 60
        env:
          OPENCODE_CHANNEL: prod
          GH_TOKEN: ${{ steps.committer.outputs.token }}
          CSC_KEYCHAIN: build.keychain
          APPLE_API_KEY: ${{ runner.temp }}/apple-api-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Create macOS .app.tar.gz
        if: runner.os == 'macOS'
        working-directory: packages/desktop/dist
        run: |
          if [[ "${{ matrix.settings.target }}" == "x86_64-apple-darwin" ]]; then
            APP_DIR="mac"
            OUT_NAME="jollicode-desktop-mac-x64.app.tar.gz"
          elif [[ "${{ matrix.settings.target }}" == "aarch64-apple-darwin" ]]; then
            APP_DIR="mac-arm64"
            OUT_NAME="jollicode-desktop-mac-arm64.app.tar.gz"
          else
            echo "Unknown macOS target: ${{ matrix.settings.target }}"
            exit 1
          fi
          APP_PATH=$(find "$APP_DIR" -maxdepth 1 -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found in $APP_DIR"
            exit 1
          fi
          tar -czf "$OUT_NAME" -C "$(dirname "$APP_PATH")" "$(basename "$APP_PATH")"

      - name: Verify signed Windows Electron artifacts
        if: runner.os == 'Windows' && inputs.sign_windows
        shell: pwsh
        run: |
          $files = @()
          $files += Get-ChildItem "${{ github.workspace }}\packages\desktop\dist\*.exe" | Select-Object -ExpandProperty FullName
          $files += Get-ChildItem "${{ github.workspace }}\packages\desktop\dist\*unpacked\*.exe" | Select-Object -ExpandProperty FullName
          $files += Get-ChildItem "${{ github.workspace }}\packages\desktop\dist\*unpacked\resources\jollicode-cli.exe" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName

          foreach ($file in $files | Select-Object -Unique) {
            $sig = Get-AuthenticodeSignature $file
            if ($sig.Status -ne "Valid") {
              throw "Invalid signature for ${file}: $($sig.Status)"
            }
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jollicode-desktop-${{ matrix.settings.target }}
          path: packages/desktop/dist/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: latest-yml-${{ matrix.settings.target }}
          path: packages/desktop/dist/latest*.yml

  publish:
    needs:
      - version
      - build-electron
    if: github.repository == 'jolliai/jollicode'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: ./.github/actions/setup-bun

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: latest-yml-*
          path: /tmp/latest-yml

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: jollicode-desktop-*
          path: /tmp/desktop
          merge-multiple: true

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          jollicode-app-id: ${{ vars.JOLLICODE_APP_ID }}
          jollicode-app-secret: ${{ secrets.JOLLICODE_APP_SECRET }}

      - name: Upload desktop release assets
        env:
          GH_TOKEN: ${{ steps.committer.outputs.token }}
          TAG: ${{ needs.version.outputs.tag }}
          REPO: ${{ needs.version.outputs.repo }}
        run: |
          shopt -s nullglob
          files=(/tmp/desktop/*.{exe,blockmap,dmg,zip,AppImage,deb,rpm} /tmp/desktop/*.app.tar.gz)
          if (( ${#files[@]} == 0 )); then
            echo "No desktop release assets found"
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$REPO"

      - name: Finalize update manifests
        run: bun ./packages/desktop/scripts/finalize-latest-yml.ts
        env:
          GH_TOKEN: ${{ steps.committer.outputs.token }}
          GH_REPO: ${{ needs.version.outputs.repo }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          LATEST_YML_DIR: /tmp/latest-yml

      # Mirror the release tag onto the source commit, like cli-v* tags, so a desktop
      # release can be traced back to the jollicode commit it was built from.
      - name: Tag source commit
        env:
          GH_TOKEN: ${{ steps.committer.outputs.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # Branch on gh's exit status, not its output: on a 404, gh skips --jq and prints the error
          # body to stdout. Any other lookup failure falls through to the create call, which fails loudly.
          # A tag at another commit can only come from an earlier failed run of this version, because
          # version.ts refuses already-published tags, so it is moved to the commit being released.
          if existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha 2>/dev/null); then
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::notice::Moving $TAG from $existing to $GITHUB_SHA"
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true
            fi
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"
          fi

      # electron-updater resolves updates only through /releases/latest; mark it explicitly rather
      # than rely on GitHub's date-and-version heuristic.
      - name: Publish release
        env:
          GH_TOKEN: ${{ steps.committer.outputs.token }}
          TAG: ${{ needs.version.outputs.tag }}
          REPO: ${{ needs.version.outputs.repo }}
        run: gh release edit "$TAG" --draft=false --latest --repo "$REPO"
