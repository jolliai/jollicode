name: publish-vscode
run-name: release vscode

# The release version is the top "## MAJOR.MINOR.PATCH" section of sdks/vscode/CHANGELOG.md. Add it on
# dev before dispatching; the marketplaces show that file as the extension's changelog.
on:
  workflow_dispatch:

concurrency: ${{ github.workflow }}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.repository == 'jolliai/jollicode'
    steps:
      # Releases are cut from dev only, the same rule as the CLI and desktop: the vscode-v* tag should
      # always point at a commit dev contains.
      - name: Require dev branch
        if: github.ref != 'refs/heads/dev'
        run: |
          echo "::error::VS Code extension releases must be dispatched from dev (got $GITHUB_REF)"
          exit 1

      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          jollicode-app-id: ${{ vars.JOLLICODE_APP_ID }}
          jollicode-app-secret: ${{ secrets.JOLLICODE_APP_SECRET }}

      - run: git fetch --force --tags
      - run: bun install -g @vscode/vsce

      - name: Install extension dependencies
        run: bun install
        working-directory: ./sdks/vscode

      - id: changelog
        run: bun ./packages/script/src/changelog.ts sdks/vscode/CHANGELOG.md

      - name: Publish
        run: |
          ./script/publish
        working-directory: ./sdks/vscode
        env:
          VERSION: ${{ steps.changelog.outputs.version }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OPENVSX_TOKEN: ${{ secrets.OPENVSX_TOKEN }}

      # The tag marks the source of each published version and is what the next run compares against.
      - name: Tag source commit
        env:
          GH_TOKEN: ${{ steps.committer.outputs.token }}
          TAG: vscode-v${{ steps.changelog.outputs.version }}
        run: |
          # Branch on gh's exit status, not its output: on a 404, gh skips --jq and prints the error
          # body to stdout. Any other lookup failure falls through to the create call, which fails loudly.
          # The publish script refuses a version that already has a tag, so one found here was pushed while
          # this run was publishing. The extension was built from this commit, so the tag is moved to it.
          if existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha 2>/dev/null); then
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::notice::Moving $TAG from $existing to $GITHUB_SHA"
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true
            fi
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"
          fi
