name: publish-cli
run-name: "${{ format('release cli {0}', inputs.version || inputs.bump) }}"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump major, minor, or patch"
        required: true
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch
      version:
        description: "Override version (optional)"
        required: false
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.version || inputs.bump }}

permissions:
  id-token: write
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    if: github.repository == 'jolliai/jollicode'
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          jollicode-app-id: ${{ vars.JOLLICODE_APP_ID }}
          jollicode-app-secret: ${{ secrets.JOLLICODE_APP_SECRET }}

      - id: version
        run: |
          ./script/version.ts
        env:
          GH_TOKEN: ${{ steps.committer.outputs.token }}
          OPENCODE_BUMP: ${{ inputs.bump }}
          OPENCODE_VERSION: ${{ inputs.version }}
          GH_REPO: ${{ github.repository }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
      repo: ${{ steps.version.outputs.repo }}

  build-cli:
    needs: version
    runs-on: ubuntu-latest
    if: github.repository == 'jolliai/jollicode'
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-tags: true

      - uses: ./.github/actions/setup-bun

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          jollicode-app-id: ${{ vars.JOLLICODE_APP_ID }}
          jollicode-app-secret: ${{ secrets.JOLLICODE_APP_SECRET }}

      - name: Build
        id: build
        run: |
          ./packages/opencode/script/build.ts
          ./packages/cli/script/build.ts
        env:
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
          OPENCODE_RELEASE: ${{ needs.version.outputs.release }}
          GH_REPO: ${{ needs.version.outputs.repo }}
          GH_TOKEN: ${{ steps.committer.outputs.token }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jollicode-cli
          path: |
            packages/opencode/dist/jollicode-darwin*
            packages/opencode/dist/jollicode-linux*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jollicode-cli-windows
          path: packages/opencode/dist/jollicode-windows*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jollicode-preview-cli
          path: packages/cli/dist/cli-*

    outputs:
      version: ${{ needs.version.outputs.version }}

  sign-cli-windows:
    needs:
      - build-cli
      - version
    runs-on: windows-latest
    if: github.repository == 'jolliai/jollicode'
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: jollicode-cli-windows
          path: packages/opencode/dist

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          jollicode-app-id: ${{ vars.JOLLICODE_APP_ID }}
          jollicode-app-secret: ${{ secrets.JOLLICODE_APP_SECRET }}

      # Signing stays optional until Azure Trusted Signing is provisioned: with no secrets at all the
      # binaries ship unsigned (with a warning), and signing resumes by itself once the secrets exist.
      # A partial configuration is a mistake, so it fails instead of silently skipping.
      - name: Check Windows signing secrets
        id: signing
        shell: bash
        run: |
          names=(AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_TRUSTED_SIGNING_ACCOUNT_NAME AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE AZURE_TRUSTED_SIGNING_ENDPOINT)
          missing=()
          for name in "${names[@]}"; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -eq ${#names[@]} ]; then
            echo "::warning::Azure Trusted Signing secrets are not configured; publishing UNSIGNED Windows CLI binaries"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Azure Trusted Signing is partially configured; missing: ${missing[*]}"
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Azure login
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/artifact-signing-action@b443cf8ea4124818d2ea9f043cba29fc3ec47b16 # v1.2.0
        if: steps.signing.outputs.enabled == 'true'
        with:
          endpoint: ${{ env.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ env.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
          files: |
            ${{ github.workspace }}\packages\opencode\dist\jollicode-windows-arm64\bin\jollicode.exe
            ${{ github.workspace }}\packages\opencode\dist\jollicode-windows-x64\bin\jollicode.exe
            ${{ github.workspace }}\packages\opencode\dist\jollicode-windows-x64-baseline\bin\jollicode.exe
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Verify Windows CLI signatures
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $files = @(
            "${{ github.workspace }}\packages\opencode\dist\jollicode-windows-arm64\bin\jollicode.exe",
            "${{ github.workspace }}\packages\opencode\dist\jollicode-windows-x64\bin\jollicode.exe",
            "${{ github.workspace }}\packages\opencode\dist\jollicode-windows-x64-baseline\bin\jollicode.exe"
          )

          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature $file
            if ($sig.Status -ne "Valid") {
              throw "Invalid signature for ${file}: $($sig.Status)"
            }
          }

      - name: Repack Windows CLI archives
        working-directory: packages/opencode/dist
        shell: pwsh
        run: |
          Compress-Archive -Path "jollicode-windows-arm64\bin\*" -DestinationPath "jollicode-windows-arm64.zip" -Force
          Compress-Archive -Path "jollicode-windows-x64\bin\*" -DestinationPath "jollicode-windows-x64.zip" -Force
          Compress-Archive -Path "jollicode-windows-x64-baseline\bin\*" -DestinationPath "jollicode-windows-x64-baseline.zip" -Force

      - name: Upload Windows CLI release assets
        if: needs.version.outputs.release != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.committer.outputs.token }}
        run: |
          gh release upload "${{ needs.version.outputs.tag }}" `
            "${{ github.workspace }}\packages\opencode\dist\jollicode-windows-arm64.zip" `
            "${{ github.workspace }}\packages\opencode\dist\jollicode-windows-x64.zip" `
            "${{ github.workspace }}\packages\opencode\dist\jollicode-windows-x64-baseline.zip" `
            --clobber `
            --repo "${{ needs.version.outputs.repo }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jollicode-cli-signed-windows
          path: |
            packages/opencode/dist/jollicode-windows-arm64
            packages/opencode/dist/jollicode-windows-x64
            packages/opencode/dist/jollicode-windows-x64-baseline

  publish:
    needs:
      - version
      - build-cli
      - sign-cli-windows
    if: always() && !failure() && !cancelled() && github.repository == 'jolliai/jollicode'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: jollicode-cli
          path: packages/opencode/dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: jollicode-cli-windows
          path: packages/opencode/dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: jollicode-cli-signed-windows
          path: packages/opencode/dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: jollicode-preview-cli
          path: packages/cli/dist

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          jollicode-app-id: ${{ vars.JOLLICODE_APP_ID }}
          jollicode-app-secret: ${{ secrets.JOLLICODE_APP_SECRET }}

      # AUR publishing is paused (see packages/opencode/script/publish.ts). Re-enable together.
      # - name: Cache apt packages (AUR)
      #   uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      #   with:
      #     path: /var/cache/apt/archives
      #     key: ${{ runner.os }}-apt-aur-${{ hashFiles('.github/workflows/publish.yml') }}
      #     restore-keys: |
      #       ${{ runner.os }}-apt-aur-
      #
      # - name: Setup SSH for AUR
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y pacman-package-manager
      #     mkdir -p ~/.ssh
      #     echo "${{ secrets.AUR_KEY }}" > ~/.ssh/id_rsa
      #     chmod 600 ~/.ssh/id_rsa
      #     git config --global user.email "noreply@jolli.ai"
      #     git config --global user.name "jollicode"
      #     ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts || true

      - run: ./script/publish.ts
        env:
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
          OPENCODE_RELEASE: ${{ needs.version.outputs.release }}
          # AUR_KEY: ${{ secrets.AUR_KEY }}  # AUR paused
          GITHUB_TOKEN: ${{ steps.committer.outputs.token }}
          GH_REPO: ${{ needs.version.outputs.repo }}
          NPM_CONFIG_PROVENANCE: false
