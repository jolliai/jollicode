name: test

on:
  push:
    branches:
      - dev
  pull_request:
  workflow_dispatch:

concurrency:
  # Keep every run on dev so cancelled checks do not pollute the default branch
  # commit history. PRs and other branches still share a group and cancel stale runs.
  group: ${{ case(github.ref == 'refs/heads/dev', format('{0}-{1}', github.workflow, github.run_id), format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref)) }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit:
    name: unit (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        # packages/opencode is 431s of a 452s `turbo test` run (265 files, 3787
        # tests); every other package finishes inside the first minute. So it is
        # sharded across runners and the rest ride a single leg alongside the
        # repo-wide checks.
        #
        # Shards are balanced by recorded duration, not file count: the suite's
        # median file takes 0.3s while the top two take 21% of the wall clock, so
        # an even split by count leaves one shard ~1.5x longer than the others.
        #
        # Turbo folds passthrough args into the task hash, so each shard caches
        # independently rather than defeating the cache restore below.
        include:
          - name: rest
            slug: rest
            args: "--filter=!jollicode"
            extras: true
          - name: opencode 1/3
            slug: opencode-1
            args: "--filter=jollicode -- --shard=1/3 --timings test-timings.json --update-timings"
          - name: opencode 2/3
            slug: opencode-2
            args: "--filter=jollicode -- --shard=2/3 --timings test-timings.json --update-timings"
          - name: opencode 3/3
            slug: opencode-3
            args: "--filter=jollicode -- --shard=3/3 --timings test-timings.json --update-timings"
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Configure git identity
        run: |
          git config --global user.email "noreply@jolli.ai"
          git config --global user.name "jollicode"

      # Turborepo 2.x keeps its filesystem cache in .turbo/cache; the old
      # node_modules/.cache/turbo path never existed, so every run saved nothing
      # and reported "0 cached, 12 total".
      #
      # The key only names a bucket -- turbo already hashes each task's inputs
      # into the entry filename -- so it stays coarse and cheap. The old
      # hashFiles('**/package.json') walked node_modules, costing ~30s on both
      # the restore and the save step. It is scoped per matrix leg because the
      # legs compute disjoint task hashes, and one shared key would let whichever
      # leg saved first win and drop every other leg's entries.
      - name: Restore Turbo cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ matrix.slug }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ matrix.slug }}-

      - name: Run unit tests
        timeout-minutes: 20
        run: GITHUB_ACTIONS=false bun turbo test ${{ matrix.args }}
        env:
          OPENCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: ${{ runner.os == 'Windows' && 'true' || 'false' }}

      # A cache saved from a pull request is scoped to that PR and unreadable by
      # any other branch, so only dev publishes one. PR runs restore from dev and
      # skip the upload instead of churning the repository's 10 GB cache budget.
      # Saved even when a later step fails: turbo only caches tasks that passed.
      - name: Save Turbo cache
        if: ${{ !cancelled() && github.event_name == 'push' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ matrix.slug }}-${{ github.sha }}

      # test-timings.json is committed from a local Linux run, which is only a
      # stand-in for runner hardware. Each shard rewrites it with its own measured
      # durations, so downloading the three artifacts and merging them produces a
      # real baseline to replace the checked-in one with.
      - name: Upload shard timings
        if: ${{ !cancelled() && !matrix.extras }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-timings-${{ matrix.slug }}
          path: packages/opencode/test-timings.json
          if-no-files-found: ignore
          retention-days: 7

      # Repo-wide, not per-shard: pinned to one leg so they do not run four times.
      - name: Check generated client
        if: ${{ matrix.extras }}
        working-directory: packages/client
        run: bun run check:generated

      # Each release publishes the top section of its product's changelog, so catch a malformed
      # heading or an empty section in review instead of when a release is dispatched.
      - name: Validate changelogs
        if: ${{ matrix.extras }}
        run: |
          for f in packages/opencode/CHANGELOG.md packages/desktop/CHANGELOG.md sdks/vscode/CHANGELOG.md; do
            bun ./packages/script/src/changelog.ts "$f"
          done
